<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#06020f" />
  <title>Dashverse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Logo palette: blue → purple → pink → red */
      --blue:   #4d8fff;
      --purple: #7c3aff;
      --pink:   #e8279a;
      --red:    #ff1f4b;
      --dark:   #06020f;
      --cream:  #f0eaff;
      --silver: #b8b0cc;
    }

    html, body { height: 100%; overflow: hidden; background: var(--dark); font-family: 'DM Sans', sans-serif; color: var(--cream); }

    .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    /* BG — deep purple-blue wash instead of amber */
    .bg-wash {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, rgba(124,58,255,0.12) 0%, rgba(77,143,255,0.06) 40%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 50% 0%,  rgba(232,39,154,0.07) 0%, transparent 60%);
      z-index: 0;
    }

    /* PROJECTOR BEAM — cool violet tint */
    .projector-beam {
      position: absolute; top: -5%; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 160px solid transparent; border-right: 160px solid transparent;
      border-top: 115vh solid rgba(140,80,255,0.028);
      z-index: 1; pointer-events: none; opacity: 0; filter: blur(18px);
    }

    /* FILM STRIPS */
    .filmstrip { position: absolute; left: 0; right: 0; height: 52px; background: #08040f; z-index: 8; overflow: hidden; display: flex; align-items: center; }
    .filmstrip.top    { top: 0; }
    .filmstrip.bottom { bottom: 0; }
    .sprockets { display: flex; align-items: center; height: 100%; width: 200%; flex-shrink: 0; }
    .sprocket-row { display: flex; align-items: center; gap: 22px; padding: 0 11px; width: 50%; flex-shrink: 0; }
    .hole {
      width: 14px; height: 22px; border-radius: 3px;
      background: var(--dark);
      border: 1.5px solid #1e1030;
      flex-shrink: 0;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
    }
    @keyframes stripScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* LOGO STAGE */
    .logo-stage { position: relative; z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; }

    /* Film gate frame — violet corners instead of amber */
    .gate-frame {
      position: absolute; inset: -34px -44px;
      border: 2px solid rgba(124,58,255,0.22);
      box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 0 80px rgba(124,58,255,0.10);
      pointer-events: none; z-index: 1; opacity: 0;
    }
    .gate-frame::before, .gate-frame::after {
      content: ''; position: absolute; width: 16px; height: 16px;
      border-style: solid; opacity: 0.8;
      /* gradient-ish corner: use pink on one, blue on the other */
    }
    .gate-frame::before { top: 8px; left: 8px; border-width: 2px 0 0 2px; border-color: var(--blue); }
    .gate-frame::after  { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-color: var(--pink); }

    /* Reel icon */
    .reel-icon { width: 46px; height: 46px; opacity: 0; transform: rotate(-90deg) scale(0.6); flex-shrink: 0; }
    /* Gradient stroke via SVG linearGradient defined inline */

    /* Logo text — gradient from blue → purple → pink */
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 13vw, 7.5rem);
      letter-spacing: 0.12em; line-height: 1;
      white-space: nowrap;
      background: linear-gradient(100deg, var(--blue) 0%, var(--purple) 40%, var(--pink) 70%, var(--red) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 30px rgba(124,58,255,0.5)) drop-shadow(0 0 60px rgba(232,39,154,0.25));
    }

    /* Shine sweep */
    .logo-shine {
      position: absolute; inset: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 13vw, 7.5rem);
      letter-spacing: 0.12em; line-height: 1; white-space: nowrap;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,0.88) 50%, transparent 75%);
      background-size: 280% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      opacity: 0;
    }

    /* Tagline — pink */
    .logo-sub {
      font-size: clamp(0.55rem, 1.8vw, 0.7rem);
      letter-spacing: 0.5em; text-transform: uppercase;
      background: linear-gradient(90deg, var(--blue), var(--pink));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      opacity: 0; transform: translateY(6px);
    }

    /* PROGRESS */
    .progress-area { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 20; width: min(65vw, 380px); opacity: 0; }
    .progress-meta { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.48rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--silver); opacity: 0.5; }
    .progress-track { width: 100%; height: 2px; background: rgba(255,255,255,0.07); position: relative; }

    /* tick marks — violet tint */
    .progress-track::before {
      content: ''; position: absolute; top: -6px; left: 0; right: 0; height: 4px;
      background: repeating-linear-gradient(
        90deg,
        rgba(124,58,255,0.35) 0px, rgba(124,58,255,0.35) 1px,
        transparent 1px, transparent 10px
      );
    }

    /* bar — full logo gradient */
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink), var(--red));
      box-shadow: 0 0 12px rgba(124,58,255,0.8), 0 0 28px rgba(232,39,154,0.4);
      position: relative;
    }
    /* traveling spark — white */
    .progress-fill::after {
      content: ''; position: absolute; right: -2px; top: 50%; transform: translateY(-50%);
      width: 5px; height: 5px; border-radius: 50%;
      background: #e8d4ff;
      box-shadow: 0 0 8px 2px rgba(200,160,255,0.95);
    }
    .frame-count { font-family: 'Bebas Neue', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; color: var(--purple); }

    /* DUST */
    #dustCanvas { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; }

    /* GRAIN */
    .grain {
      position: fixed; inset: -40%; z-index: 40; pointer-events: none; opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px; mix-blend-mode: overlay;
      animation: grainShift 0.12s steps(3) infinite;
    }
    @keyframes grainShift { 0% { transform: translate(0,0); } 33% { transform: translate(-4%,-3%); } 66% { transform: translate(3%,4%); } 100% { transform: translate(-2%,2%); } }

    .vignette { position: fixed; inset: 0; z-index: 35; pointer-events: none; background: radial-gradient(ellipse 72% 68% at 50% 50%, transparent 30%, rgba(0,0,0,0.85) 100%); }

    /* Flash — cool white-purple */
    .flash { position: fixed; inset: 0; z-index: 50; background: #d4c0ff; opacity: 0; pointer-events: none; }

    /* Burn exit — blue-to-pink radial instead of amber */
    .burn {
      position: fixed; inset: 0; z-index: 55;
      background: radial-gradient(circle at 50% 50%, #c4aaff 0%, #7c3aff 25%, #e8279a 55%, #06020f 80%);
      opacity: 0; pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
      #dustCanvas { display: none; }
    }
  </style>
</head>
<body>
<div class="stage">
  <div class="bg-wash"></div>
  <div class="projector-beam"></div>
  <canvas id="dustCanvas" aria-hidden="true"></canvas>

  <!-- FILM STRIPS -->
  <div class="filmstrip top" aria-hidden="true">
    <div class="sprockets"><div class="sprocket-row" id="tR1"></div><div class="sprocket-row" id="tR2"></div></div>
  </div>
  <div class="filmstrip bottom" aria-hidden="true">
    <div class="sprockets"><div class="sprocket-row" id="bR1"></div><div class="sprocket-row" id="bR2"></div></div>
  </div>

  <!-- LOGO -->
  <div class="logo-stage" id="logoStage">
    <div class="gate-frame" aria-hidden="true"></div>

    <!-- Reel icon with gradient stroke -->
    <svg class="reel-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#4d8fff"/>
          <stop offset="50%"  stop-color="#7c3aff"/>
          <stop offset="100%" stop-color="#e8279a"/>
        </linearGradient>
      </defs>
      <circle cx="24" cy="24" r="21" stroke="url(#reelGrad)" stroke-width="1.5" fill="none" stroke-opacity="0.7"/>
      <circle cx="24" cy="24" r="5"  stroke="url(#reelGrad)" stroke-width="1.5" fill="none"/>
      <circle cx="24" cy="10" r="3"  stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="24" cy="38" r="3"  stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="10" cy="24" r="3"  stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="38" cy="24" r="3"  stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="14.1" cy="14.1" r="3" stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="33.9" cy="33.9" r="3" stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="14.1" cy="33.9" r="3" stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
      <circle cx="33.9" cy="14.1" r="3" stroke="url(#reelGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>
    </svg>

    <div style="position:relative">
      <div class="logo-text" id="logoText">DASHVERSE</div>
      <div class="logo-shine" id="logoShine">DASHVERSE</div>
    </div>


  </div>

  <!-- PROGRESS -->
  <div class="progress-area" aria-hidden="true">
    <div class="progress-meta"><span>Loading</span><span class="frame-count" id="frameCount">000</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="vignette" aria-hidden="true"></div>
<div class="grain"    aria-hidden="true"></div>
<div class="flash"    id="flash" aria-hidden="true"></div>
<div class="burn"     id="burn"  aria-hidden="true"></div>

<script>
/* ── SPROCKET HOLES ── */
(function() {
  var count = Math.ceil(window.innerWidth / 36) + 6;
  ['tR1','tR2','bR1','bR2'].forEach(function(id) {
    var row = document.getElementById(id);
    for (var i = 0; i < count; i++) { var h = document.createElement('div'); h.className = 'hole'; row.appendChild(h); }
  });
})();

/* ── DUST MOTES — hue shifted to violet/pink range ── */
(function() {
  var canvas = document.getElementById('dustCanvas'), ctx = canvas.getContext('2d'), W, H, motes = [], raf;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function spawn() {
    motes = [];
    for (var i = 0; i < 55; i++) {
      motes.push({
        x: Math.random()*W, y: Math.random()*H,
        r: 0.4+Math.random()*1.4, alpha: 0.04+Math.random()*0.22,
        vx: (Math.random()-0.5)*0.16, vy: -0.04-Math.random()*0.18,
        /* hue 240–320 = blue → purple → pink */
        hue: 240+Math.random()*80,
        t: Math.random()*Math.PI*2
      });
    }
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    /* projector beam cone — violet tint */
    var grd = ctx.createRadialGradient(W*.5,0,10,W*.5,H*.5,H*.75);
    grd.addColorStop(0,'rgba(140,80,255,0.05)');
    grd.addColorStop(1,'transparent');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
    motes.forEach(function(m,i) {
      m.x+=m.vx; m.y+=m.vy; m.t+=0.03;
      if(m.y<-4){m.y=H+4;m.x=Math.random()*W;} if(m.x<-4)m.x=W+4; if(m.x>W+4)m.x=-4;
      var flk = 0.7+0.3*Math.sin(m.t+i);
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
      ctx.fillStyle='hsla('+m.hue+',80%,80%,'+(m.alpha*flk)+')'; ctx.fill();
    });
    raf = requestAnimationFrame(draw);
  }
  resize(); spawn(); window.addEventListener('resize',function(){resize();spawn();});
  window.__startDust = function(){ canvas.style.opacity=1; raf=requestAnimationFrame(draw); };
  window.__stopDust  = function(){ if(raf) cancelAnimationFrame(raf); };
})();

/* ── STRIP SCROLL ── */
function startStrips(spd) {
  document.querySelectorAll('.sprockets').forEach(function(el,i){
    el.style.animation='stripScroll '+(spd+i*0.5)+'s linear infinite';
    el.style.animationDirection=i%2===0?'normal':'reverse';
  });
}

/* ── FRAME COUNTER ── */
var frameEl = document.getElementById('frameCount');
function setFrame(v) { frameEl.textContent = String(Math.round(v)).padStart(3,'0'); }

/* ── MASTER TIMELINE ── */
window.addEventListener('load', function() {
  var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  tl
  .call(function(){ window.__startDust(); startStrips(5); }, [], 0)
  .to('.projector-beam', { opacity:1, duration:1.4, ease:'power2.inOut' }, 0)
  .fromTo('.filmstrip.top',    {y:-52}, {y:0, duration:0.7, ease:'expo.out'}, 0)
  .fromTo('.filmstrip.bottom', {y:52},  {y:0, duration:0.7, ease:'expo.out'}, 0.08)

  .to('#logoStage',  { opacity:1, duration:0.5 }, 0.5)
  .to('.gate-frame', { opacity:1, duration:0.7 }, 0.65)

  /* Reel icon spins in */
  .to('.reel-icon', {
    opacity:1, rotation:0, scale:1,
    duration:0.85, ease:'back.out(1.6)', transformOrigin:'center center'
  }, 0.6)
  .to('.reel-icon', {
    rotation:360, duration:7, repeat:-1, ease:'none', transformOrigin:'center center'
  }, 1.6)

  /* Logo text gate-open reveal */
  .fromTo('#logoText',
    { scaleY:0, opacity:0, filter:'blur(10px)' },
    { scaleY:1, opacity:1, filter:'blur(0px)', duration:0.6, ease:'expo.out', transformOrigin:'bottom center' },
    0.75)

  /* Shine sweep */
  .fromTo('#logoShine',
    { backgroundPosition:'200% 0', opacity:0 },
    { backgroundPosition:'-80% 0', opacity:1, duration:1.3, ease:'power2.inOut',
      onComplete:function(){ gsap.set('#logoShine',{opacity:0}); }},
    1.0)

/* Progress */
  .to('.progress-area', { opacity:1, duration:0.4 }, 0.7)
  .to('#progressFill', {
    width:'100%', duration:2.8, ease:'power1.inOut',
    onUpdate: function() {
      var w = parseFloat(document.getElementById('progressFill').style.width)||0;
      setFrame(w);
    }
  }, 0.7)

  /* Strips accelerate */
  .call(function(){ startStrips(22); }, [], 3.2)

  /* EXIT */
  .to(['#logoStage','.progress-area'],
    { opacity:0, y:-28, duration:0.45, ease:'power3.in', stagger:0.05 }, 3.4)

  .to('#burn', { opacity:1, duration:0.45, ease:'power3.in' }, 3.65)
  .to('#burn', { opacity:0, duration:0.3,  ease:'power2.out' }, 4.1)

  .to('.stage', {
    opacity:0, duration:0.35, ease:'power2.in',
    onComplete: function() {
      window.__stopDust();
      window.location.replace('app.html');
    }
  }, 4.3);
});
</script>
</body>
</html>
