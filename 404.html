<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030014">
    <title>404 — Dashverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashverse-ui.css">
    <style>
        :root {
            --p: #e879f9;
            --p2: #7c3aed;
            --ac: #22d3ee;
        }
        [data-theme="light"] {
            --bg: #faf5ff;
            --txt: #1e0a2e;
            --muted: #6b5a7a;
            --card: rgba(255,255,255,.92);
            --gb: rgba(192,38,211,.18);
            --orb-op: .1;
        }
        [data-theme="dark"] {
            --bg: #030014;
            --txt: #faf5ff;
            --muted: rgba(245,240,255,.55);
            --card: rgba(255,255,255,.07);
            --gb: rgba(232,121,249,.16);
            --orb-op: .18;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', system-ui, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--txt);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease, color 0.3s ease;
        }
        [data-theme="dark"] body {
            background:
                radial-gradient(ellipse 100% 80% at 15% -10%, rgba(192,38,211,.24) 0%, transparent 55%),
                radial-gradient(ellipse 80% 60% at 90% 30%, rgba(34,211,238,.14) 0%, transparent 50%),
                linear-gradient(180deg, #030014 0%, #0a0618 50%, #030014 100%);
        }
        [data-theme="light"] body {
            background:
                radial-gradient(ellipse 90% 70% at 80% -5%, rgba(232,121,249,.14) 0%, transparent 50%),
                linear-gradient(185deg, #fffefb 0%, #faf5ff 50%, #f5f0ff 100%);
        }
        .bg-fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--orb-op); }
        .o1 { width: min(80vw, 480px); height: min(80vw, 480px); background: var(--p); top: -15%; left: -12%; animation: ofl 18s ease-in-out infinite; }
        .o2 { width: min(65vw, 400px); height: min(65vw, 400px); background: var(--p2); bottom: -12%; right: -10%; animation: ofl 22s ease-in-out infinite reverse; }
        .grid-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
            background-image:
                linear-gradient(rgba(232,121,249,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,211,238,.04) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 85% 75% at 50% 45%, black 15%, transparent 72%);
        }
        #stars { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle linear infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
        .toolbar { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 100; display: flex; justify-content: space-between; gap: 10px; }
        .tool-btn {
            width: 42px; height: 42px; border-radius: 12px;
            background: var(--card); border: 1px solid var(--gb);
            color: var(--txt); cursor: pointer; font-size: 1.05rem;
            display: flex; align-items: center; justify-content: center;
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            backdrop-filter: blur(20px) saturate(1.3);
            box-shadow: 0 8px 28px rgba(0,0,0,.2);
        }
        .tool-btn.home { background: linear-gradient(135deg, var(--p), var(--p2)); color: #fff; border: none; }
        .wrap {
            position: relative; z-index: 2; text-align: center;
            padding: 32px 24px; max-width: 520px;
            animation: dvReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .code {
            font-family: 'Syne', system-ui, sans-serif;
            font-size: clamp(4.5rem, 18vw, 8rem);
            font-weight: 800;
            line-height: 0.95;
            background: linear-gradient(135deg, #fff 0%, #f0abfc 40%, #22d3ee 75%, #fde68a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(232,121,249,.35));
        }
        [data-theme="light"] .code {
            background: linear-gradient(135deg, #1e0a2e 0%, #a21caf 45%, #0891b2 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .orbit {
            width: 180px; height: 180px; margin: 0 auto 28px;
            border-radius: 50%;
            border: 1px solid color-mix(in srgb, var(--p) 35%, transparent);
            position: relative;
            animation: spin 14s linear infinite;
        }
        .orbit-dot {
            position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 12px; border-radius: 50%;
            background: linear-gradient(135deg, var(--p), var(--ac));
            box-shadow: 0 0 20px rgba(232,121,249,.7);
        }
        .orbit-center {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            animation: spin-r 14s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-r { to { transform: translate(-50%, -50%) rotate(-360deg); } }
        h2 { font-size: clamp(1.25rem, 4vw, 1.65rem); font-weight: 800; margin-bottom: 10px; }
        p { color: var(--muted); line-height: 1.65; margin-bottom: 28px; font-size: 0.95rem; }
        .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 12px 22px; border-radius: 50px; font-size: 0.88rem; font-weight: 700;
            cursor: pointer; text-decoration: none; border: none;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-p {
            background: linear-gradient(135deg, var(--p), var(--p2));
            color: #fff;
            box-shadow: 0 10px 32px rgba(232,121,249,.35);
        }
        .btn-s {
            background: var(--card);
            color: var(--txt);
            border: 1px solid var(--gb);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body>
    <div class="bg-fx" aria-hidden="true">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
    </div>
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <div class="toolbar">
        <button class="tool-btn home" type="button" onclick="location.href='app.html'" title="Home">🏠</button>
        <button class="tool-btn" type="button" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">🌙</button>
    </div>

    <main class="wrap">
        <div class="orbit" aria-hidden="true">
            <div class="orbit-dot"></div>
            <div class="orbit-center">🛸</div>
        </div>
        <div class="code">404</div>
        <h2>Page not found</h2>
        <p>This route drifted off the Dashverse map. Head back to the employee app or admin panel.</p>
        <div class="btns">
            <a href="app.html" class="btn btn-p">Employee App</a>
            <a href="admin.html" class="btn btn-s">Admin Panel</a>
        </div>
    </main>
    <script>
        const THEME_KEY = 'atp_theme';
        let theme = localStorage.getItem(THEME_KEY) || 'dark';
        function applyTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem(THEME_KEY, t);
            document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() { applyTheme(theme === 'dark' ? 'light' : 'dark'); }
        applyTheme(theme);
        const s = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const st = document.createElement('div');
            st.className = 'star';
            const sz = Math.random() * 2.2 + 0.6;
            st.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;top:' + (Math.random() * 100) + '%;left:' + (Math.random() * 100) + '%;animation-duration:' + (Math.random() * 3 + 2) + 's;animation-delay:' + (Math.random() * 4) + 's;opacity:' + (0.3 + Math.random() * 0.5);
            s.appendChild(st);
        }
    </script>
</body>
</html>
